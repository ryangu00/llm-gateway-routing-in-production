router_settings:
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60
  enable_pre_call_checks: true
  fallbacks:
  - entry-a:
    - second-hop
    - cloud-tail
  - entry-b:
    - second-hop
    - cloud-tail
  - entry-c:
    - second-hop
    - cloud-tail-b
  context_window_fallbacks:
  - entry-a:
    - second-hop
    - isolation-group
    - cloud-tail
  - entry-b:
    - second-hop
    - isolation-group
    - cloud-tail
  - entry-c:
    - second-hop
    - isolation-group
    - cloud-tail
litellm_settings:
  request_timeout: 300
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  disable_adding_master_key_hash_to_db: true
  allow_requests_on_db_unavailable: true
  pass_through_request_timeout: 60
